[package]
name = "flaresolverr-rs"
version = "0.1.5"
edition = "2021"
description = "Rust port of FlareSolverr — Cloudflare bypass proxy and library using headless Chromium"
license = "MIT"
repository = "https://github.com/eben0/flaresolverr-rs"
keywords = ["cloudflare", "flaresolverr", "bypass", "scraping", "chromium"]
categories = ["web-programming", "web-programming::http-client"]
readme = "README.md"
exclude = ["plan.md", "bench/"]

[lib]
name = "flaresolverr_rs"
path = "src/lib.rs"

[[bin]]
name = "flaresolverr-rs"
path = "src/main.rs"

[dependencies]
axum        = "0.7"
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4"] }
dashmap     = "6"
thiserror   = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow      = "1"
futures     = "0.3"
figment     = { version = "0.10", features = ["toml", "env"] }
chaser-oxide = "0.2.4"
base64 = "0.22"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
